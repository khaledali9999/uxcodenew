<style>
.pd-pill{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:999px;font-weight:800;font-size:14px;border:1.5px solid var(--o);color:var(--x-ink);background:var(--x-surf)}
.pd-pill.fill{background:linear-gradient(90deg,#ff6a00,#ff9a2e);color:#fff;border-color:transparent}
.pd-eyebrow{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;color:var(--x-ink)}
.pd-eyebrow::before{content:"";width:44px;height:3px;border-radius:3px;background:var(--o)}
.pd-h2{font-weight:900;color:var(--x-ink);font-size:clamp(28px,4.2vw,46px);line-height:1.25}
.pd-h2::after{content:"";display:block;width:64px;height:3px;border-radius:3px;background:var(--o);margin-top:10px}
.pd-h2.center::after{margin-inline:auto}
.pd-steps{display:grid;gap:30px;grid-template-columns:1fr}
@media(min-width:640px){.pd-steps{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.pd-steps{grid-template-columns:repeat(4,1fr)}}
.pd-step{position:relative;background:var(--x-surf);border:1px solid var(--x-line);border-radius:26px;padding:24px 26px 28px;box-shadow:0 22px 44px -30px rgba(120,70,40,.35)}
.pd-step-top{display:flex;justify-content:space-between;align-items:flex-start;min-height:84px}
.pd-num{width:38px;height:38px;border-radius:50%;background:var(--o);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pd-ico{width:84px;height:84px;object-fit:contain;mix-blend-mode:multiply}
@media(min-width:1024px){
 .pd-step:not(:last-child)::after{content:"";position:absolute;top:50%;inset-inline-end:-20px;width:10px;height:10px;margin-top:-5px;border-left:3px solid var(--o);border-bottom:3px solid var(--o);transform:rotate(45deg)}
 html[dir="ltr"] .pd-step:not(:last-child)::after{transform:rotate(-135deg)}
}
.pd-chal{display:grid;gap:32px;align-items:center}
@media(min-width:1024px){.pd-chal{grid-template-columns:1fr 330px}}
.pd-robot{width:100%;max-width:300px;margin-inline:auto;mix-blend-mode:multiply}
@media(max-width:1023px){.pd-robot{max-width:200px}}
.pd-row{background:var(--x-surf);border:1px solid var(--x-line);border-radius:22px;padding:14px;display:grid;gap:14px;box-shadow:0 18px 40px -30px rgba(120,70,40,.3)}
@media(min-width:768px){.pd-row{grid-template-columns:1fr 1fr;align-items:center}}
.pd-prob{display:flex;align-items:center;gap:14px;padding:6px 8px}
.pd-badge{display:inline-flex;flex:none;align-items:center;gap:8px;white-space:nowrap;background:#fdeceb;color:#e8462f;font-weight:800;font-size:13px;padding:12px 18px;border-radius:999px}
.pd-sol{display:flex;align-items:flex-start;gap:12px;background:#e7f7ee;border-radius:18px;padding:16px 18px}
.pd-sol small{display:block;color:#1f9d55;font-weight:800;font-size:11px;margin-bottom:2px}
.pd-sol svg{flex:none}
.pd-res{position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(100deg,#1b2a47 0%,#24304a 60%,#2b3350 100%);color:#fff;min-height:170px;display:flex;align-items:center;padding:28px 40px}
.pd-res-art{position:absolute;inset-block:0;inset-inline-start:0;height:100%;width:56%;object-fit:cover;object-position:right center;-webkit-mask-image:linear-gradient(to left,#000 65%,transparent);mask-image:linear-gradient(to left,#000 65%,transparent)}
html[dir="ltr"] .pd-res-art{object-position:left center;-webkit-mask-image:linear-gradient(to right,#000 65%,transparent);mask-image:linear-gradient(to right,#000 65%,transparent)}
.pd-res-txt{position:relative;z-index:1;margin-inline-start:auto;max-width:46%}
.pd-res-head{display:flex;align-items:center;gap:16px}
.pd-res-head .ln{width:48px;height:3px;border-radius:3px;background:var(--o)}
.pd-res .pd-h2{color:#fff;font-size:clamp(24px,3vw,34px)}
.pd-res .pd-h2::after{width:44px}
@media(max-width:767px){.pd-res{padding:24px}.pd-res-txt{max-width:100%}.pd-res-art{opacity:.25;width:100%}}
html[data-theme="dark"] .pd-ico,html[data-theme="dark"] .pd-robot{mix-blend-mode:normal;background:#fff3e8;border-radius:22px;padding:4px}
html[data-theme="dark"] .pd-robot{border-radius:36px}
html[data-theme="dark"] .pd-step,html[data-theme="dark"] .pd-row{box-shadow:none}
html[data-theme="dark"] .pd-badge{background:color-mix(in srgb,#e8462f 16%,transparent)}
html[data-theme="dark"] .pd-sol{background:color-mix(in srgb,#1f9d55 16%,transparent)}
</style>

<style id="theme-css">
  /* UXCode — theme.css  (حمّله بعد style.css) */

/* ---------- متغيرات الثيم ---------- */
:root{
  --x-bg:#fffaf6;
  --x-ink:#3a2314;
  --x-surf:#ffffff;
  --x-surf2:#f7f4ee;
  --x-tint:#fff1e8;
  --x-soft:#fde6d8;
  --x-soft2:#ffede4;
  --x-ph:#efe6dc;
  --x-line:#ece4d8;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --x-bg:#15100c;
  --x-ink:#f6ece4;
  --x-surf:#221812;
  --x-surf2:#1b130e;
  --x-tint:#231810;
  --x-soft:color-mix(in srgb,var(--o) 20%,transparent);
  --x-soft2:color-mix(in srgb,var(--o) 14%,transparent);
  --x-ph:#2a1e16;
  --x-line:#3a2a1e;
  /* متغيرات style.css الأصلية */
  --ink:#f6ece4;
  --mute:#b9a698;
}

html[data-theme="dark"] body{background:var(--x-bg) !important;color:var(--x-ink)}
html[data-theme="dark"]{background:var(--x-bg)}
.site-hdr{background:color-mix(in srgb,var(--x-bg) 90%,transparent)}

/* ---------- أزرار التبديل ---------- */
.ctl{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:36px;height:36px;padding:0 10px;border-radius:999px;
  border:1px solid var(--x-line);background:transparent;color:var(--x-ink);
  font:700 12px/1 'Inter','Noto Kufi Arabic',sans-serif;cursor:pointer;
  transition:border-color .2s,color .2s;
}
.ctl:hover{border-color:var(--o);color:var(--o)}
.ctl:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.ctl:not(.ctl-lang){width:36px;padding:0}
.ctl .ico-sun{display:none}
html[data-theme="dark"] .ctl .ico-sun{display:block}
html[data-theme="dark"] .ctl .ico-moon{display:none}

html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{
  transition:background-color .3s,color .3s,border-color .3s !important;
}

/* ---------- الدارك: عناصر style.css ---------- */
html[data-theme="dark"] .card{background:var(--x-tint) !important;border-color:var(--x-line) !important;box-shadow:none !important}
html[data-theme="dark"] .btn-w{background:var(--x-surf) !important;color:var(--x-ink) !important;border:1px solid var(--x-line) !important}
html[data-theme="dark"] .btn-w:hover{border-color:var(--o) !important}
html[data-theme="dark"] .tab{background:var(--x-surf) !important;color:var(--x-ink) !important;border:1px solid var(--x-line) !important}
html[data-theme="dark"] .tab.active{background:var(--o) !important;color:#fff !important;border-color:var(--o) !important}
html[data-theme="dark"] .rv-tag{background:var(--x-soft) !important;color:var(--x-ink) !important;border:1px solid var(--x-line) !important}

/* الخدمات */
html[data-theme="dark"] .svc-sec{background:var(--x-surf2) !important;background-image:none !important}
html[data-theme="dark"] .svc-sec::before,
html[data-theme="dark"] .svc-sec::after{opacity:.15 !important}
html[data-theme="dark"] .svc-card{background:var(--x-surf) !important;background-image:none !important;border:1px solid var(--x-line) !important;box-shadow:none !important}
html[data-theme="dark"] .svc-h2,
html[data-theme="dark"] .svc-title{color:var(--x-ink) !important}
html[data-theme="dark"] .svc-sub,
html[data-theme="dark"] .svc-desc{color:var(--mute) !important}
html[data-theme="dark"] .svc-ico{background:var(--x-soft) !important}
html[data-theme="dark"] .svc-eyebrow{color:var(--o) !important}

/* الأسئلة الشائعة */
html[data-theme="dark"] .faq2-sec{background:transparent !important;background-image:none !important}
html[data-theme="dark"] .faq2-item{background:var(--x-surf) !important;border:1px solid var(--x-line) !important;box-shadow:none !important}
html[data-theme="dark"] .faq2-h2,
html[data-theme="dark"] .faq2-q{color:var(--x-ink) !important}
html[data-theme="dark"] .faq2-sub,
html[data-theme="dark"] .faq2-a{color:var(--mute) !important}
html[data-theme="dark"] .faq2-badge,
html[data-theme="dark"] .faq2-ic{background:var(--x-soft) !important;color:var(--o) !important;border-color:transparent !important}

/* CTA */
html[data-theme="dark"] .cta2{background:var(--x-surf2) !important;background-image:none !important}
html[data-theme="dark"] .cta2-h,
html[data-theme="dark"] .cta2-top{color:var(--x-ink) !important}
html[data-theme="dark"] .cta2-sub{color:var(--mute) !important}

/* الصور + البلوب */
html[data-theme="dark"] img{filter:brightness(.86) contrast(1.04)}
html[data-theme="dark"] .blob{opacity:.2 !important}

/* ---------- الإنجليزي (LTR) ---------- */
html[lang="en"] body,
html[lang="en"] body *{font-family:'Inter','Noto Kufi Arabic',system-ui,sans-serif}
html[dir="ltr"] .btn [data-i="arrow"]{transform:scaleX(-1)}
html[lang="en"] h1{letter-spacing:-.01em;line-height:1.12}
html[lang="en"] h2{letter-spacing:-.01em}

@media (prefers-reduced-motion:reduce){html.theme-anim *{transition:none !important}}

/* ---------- شاشة التحميل ---------- */
#loader{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:var(--x-bg);
  transition:opacity .5s ease,visibility .5s ease;
}
#loader.hide{opacity:0;visibility:hidden}
html.is-loading{overflow:hidden}

#loader .ld-logo{
  direction:ltr;display:flex;align-items:center;gap:2px;
  font:900 44px/1 'Inter','Noto Kufi Arabic',sans-serif;
  color:var(--x-ink);letter-spacing:-.02em;
  animation:ldPulse 1.6s ease-in-out infinite;
}
#loader .ld-logo b{color:var(--o)}
#loader .ld-br{
  color:var(--o);font-weight:800;opacity:.9;
  animation:ldBr 1.2s ease-in-out infinite;
}
#loader .ld-br:last-child{animation-delay:.6s}

#loader .ld-bar{
  width:160px;height:4px;border-radius:999px;overflow:hidden;
  background:var(--x-soft);
}
#loader .ld-bar::after{
  content:"";display:block;height:100%;width:40%;border-radius:999px;
  background:var(--o);
  animation:ldBar 1.1s ease-in-out infinite;
}
#loader .ld-dots{display:flex;gap:6px}
#loader .ld-dots i{
  width:7px;height:7px;border-radius:50%;background:var(--o);
  animation:ldDot 1s ease-in-out infinite;
}
#loader .ld-dots i:nth-child(2){animation-delay:.15s}
#loader .ld-dots i:nth-child(3){animation-delay:.3s}

@keyframes ldPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ldBr{0%,100%{transform:translateX(0);opacity:.9}50%{transform:translateX(var(--mv,4px));opacity:.4}}
#loader .ld-br:first-child{--mv:-5px}
#loader .ld-br:last-child{--mv:5px}
@keyframes ldBar{0%{transform:translateX(-120%)}100%{transform:translateX(350%)}}
@keyframes ldDot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}

@media (prefers-reduced-motion:reduce){
  #loader *{animation:none !important}
}
.pd-back{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:9px 18px;border-radius:999px;border:1.5px solid var(--x-line);background:var(--x-surf);color:var(--x-ink);font-weight:800;font-size:13px;transition:border-color .2s,color .2s}
.pd-back:hover{border-color:var(--o);color:var(--o)}
html[dir="ltr"] .pd-back svg{transform:scaleX(-1)}
@media(max-width:480px){.pd-back{padding:9px 12px}.pd-back span{display:none}}
</style>

  if(typeof v==='string') return v;
  return v[root.lang==='en'?'en':'ar']||v.ar||'';
}

document.getElementById('langBtn').addEventListener('click',function(){
  var l=root.lang==='ar'?'en':'ar';

  render();
});
document.getElementById('themeBtn').addEventListener('click',function(){
  var t=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content=(t==='dark'?'#16100c':'#fffaf6');
  try{localStorage.setItem('ux-theme',t);}catch(e){}
});
render();
})();
